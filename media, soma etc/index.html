<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Dois Números</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <img src="https://via.placeholder.com/150x50?text=LOGOTIPO" alt="Logotipo" class="logo">
        </header>

        <main>
            <h1>Analisador de Números</h1>
            <div class="input-group">
                <input type="number" id="num1" placeholder="Digite o primeiro número">
                <input type="number" id="num2" placeholder="Digite o segundo número">
            </div>
            <button onclick="calcular()">Analisar</button>

            <div id="resultado" class="results-area">
                </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
